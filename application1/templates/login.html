<!DOCTYPE html>
<html lang="en">
<head>
  {% load widget_tweaks %}
  <title>Login page</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    nav {
      background-color: white;
      height: 20px;
      padding: 20px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0.5px 10px rgba(167, 167, 167, 0.2);
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
      z-index: 1000;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 30px;
      margin-right: 200px;
    }

    .nav-right a {
      text-decoration: none;
      color: black;
      font-size: 18px;
    }

    .nav-right a:hover {
      text-decoration: underline;
    }

    .nav-right button {
      background-color: #6b00d6;
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }

    .nav-right button:hover {
      background-color: #9660f3;
    }

    img {
      width: 180px;
      height: 120px;
      border-radius: 10%;
      margin-left: 200px;
    }

    .container {
      width: 50%;
      margin: 100px auto 50px;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <nav>
    <!-- Logo -->
    <div>
      <a href="{% url 'aboutpage' %}">
        <img src="https://www.lettertoyourself.com/images/logo-59791daff261674b59063b28e387833c.svg?vsn=d" alt="Logo">
      </a>
    </div>
    <div class="nav-right">
      <a href="{% url 'blog' %}">Blog</a>
      <a href="{% url 'change_address' %}">Change Your Address</a>
      <a href="{% url 'login' %}">Login</a>
      <a href="{% url 'register' %}">Sign up</a>
      <button><a href="{% url 'write_letter' %}" style="color:white;">Write a letter</a></button>
    </div>
  </nav>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-sm-6 mt-4">
        <h2>Login form</h2>

        {% if form.errors %}
          <div class="alert alert-danger">
            {{ form.non_field_errors }}
          </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
          {% csrf_token %}

          <div class="form-group">
            <label for="id_username">Username:</label>
            {{ form.username|add_class:"form-control" }}
          </div>

          <div class="form-group">
            <label for="id_password">Password:</label>
            {{ form.password|add_class:"form-control" }}
          </div>

          <button type="submit" class="btn btn-dark">Submit</button>
          <a href="{% url 'register' %}" class="btn btn-primary">Register</a>
        </form>
      </div>
    </div>
  </div>

</body>
</html>
